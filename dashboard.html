<!DOCTYPE html>
<html>
<head>
    <title>Mini School Portal - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">
    <h2>Welcome, <span id="studentEmail"></span></h2>
    <p>This is your student dashboard.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    let email = localStorage.getItem("studentEmail");
    if(!email) {
      // If no login info, go back to login page
      window.location.href = "index.html";
    } else {
      document.getElementById("studentEmail").innerText = email;
    }

    function logout() {
      localStorage.clear();
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
